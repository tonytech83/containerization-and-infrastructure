---
- name: Debian - Install Apache HTTP server and dependencies
  apt:
    name:
      - apache2
      - git
    state: present

- name: Debian - Start and enable Apache service
  service:
    name: apache2
    state: started
    enabled: true

- name: Debian - Collect package information
  package_facts:
    manager: auto

- name: Debian - Open HTTP port in firewall
  ufw:
    rule: allow
    port: 80
    proto: tcp
  when: "'ufw' in ansible_facts.packages"